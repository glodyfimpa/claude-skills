name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    env:
      # Single place to bump shellcheck: change the version and the SHA-256 of
      # shellcheck-v<version>.linux.x86_64.tar.xz from the koalaman/shellcheck release.
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned shellcheck
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "$archive"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: Run shellcheck (severity warning)
        # Fixtures under bash-portability-linter/tests/fixtures are deliberately
        # non-portable; tests/test_bureaucratic_research_assistant.sh is a bats file.
        run: |
          shellcheck --version
          # Fail if the runner's default shellcheck shadowed the pinned one.
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          shellcheck -S warning \
            install.sh install-hooks.sh sync.sh \
            tests/test_sync.sh \
            bash-portability-linter/bin/bash-portability-linter

  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install bats-core; else sudo apt-get update -qq && sudo apt-get install -y -qq bats; fi
          bats --version
      - name: bash-portability-linter
        run: bats bash-portability-linter/tests/linter.bats
      - name: session-retrospective (show-neighbors CLI)
        run: bats session-retrospective/tests/test_show_neighbors.bats
      - name: Bureaucratic Research Assistant skills
        run: bats tests/test_bureaucratic_research_assistant.sh
      # Model-backed evals (*/tests/eval/*.eval.bats) need RUN_EVALS=1 and an API key:
      # not run in CI.

  shell-tests:
    name: sync.sh tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tests/test_sync.sh
        run: bash tests/test_sync.sh

  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: forfettario-tax-calculator
        run: python -m pytest -v forfettario-tax-calculator/tests
      - name: session-retrospective (neighbors engine)
        # The test imports neighbors.py from the skill root, so it runs from there.
        working-directory: session-retrospective
        run: python -m pytest -v tests/test_neighbors.py
